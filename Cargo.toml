[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Neo4j
neo4rs = "0.8"

# Tree-sitter
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"

# CLI
clap = { version = "4", features = ["derive"] }

# Embeddings
async-openai = { version = "0.36.0", features = ["embedding"] }
ort = "2.0.0-rc.9"
tokenizers = "0.22.2"

# Hashing
blake3 = "1"

# File walking
ignore = "0.4"

# Internal crates
codegraph-core = { path = "crates/codegraph-core" }
codegraph-parser = { path = "crates/codegraph-parser" }
codegraph-graph = { path = "crates/codegraph-graph" }
codegraph-embed = { path = "crates/codegraph-embed" }
codegraph-query = { path = "crates/codegraph-query" }
